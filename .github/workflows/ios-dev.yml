name: Manual iOS Dev Build (Ad Hoc)

on:
  workflow_dispatch:

jobs:
  build-ios-dev:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install Apple cert and Ad Hoc provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.DEV_BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build iOS Framework (Kotlin)
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 -Pkotlin.native.jvmArgs="-Xmx8g" -Pkotlin.mpp.androidSourceSetLayoutV2AndroidStyleDirs.nowarn=true -Pkotlin.mpp.applyDefaultHierarchyTemplate=false
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx8g"

      - name: Force last Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build & Archive Xcode Project
        run: |
          VERSION_NAME=$(grep "mosaic.versionName" gradle.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep "mosaic.versionCode" gradle.properties | cut -d'=' -f2)
          echo "iOS Dev -> $VERSION_NAME ($VERSION_CODE)"
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath $PWD/build/Mosaic.xcarchive \
                     DEVELOPMENT_TEAM="88KUPU5378" \
                     CODE_SIGN_STYLE="Manual" \
                     PROVISIONING_PROFILE_SPECIFIER="${{ secrets.DEV_PROVISIONING_PROFILE_NAME }}" \
                     CODE_SIGN_IDENTITY="iPhone Distribution" \
                     CODE_SIGN_ENTITLEMENTS="iosApp/iosApp.entitlements" \
                     MARKETING_VERSION="$VERSION_NAME" \
                     CURRENT_PROJECT_VERSION="$VERSION_CODE" \
                     clean archive

      - name: Generate Ad Hoc Export Options
        run: |
          # Création d'un plist temporaire pour forcer l'export Ad Hoc avec le profil
          cat <<EOF > iosApp/ExportOptionsAdHoc.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>88KUPU5378</string>
              <key>compileBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>space.ourmosaic.app</key>
                  <string>${{ secrets.DEV_PROVISIONING_PROFILE_NAME }}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export .ipa
        run: |
          cd iosApp
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/Mosaic.xcarchive \
                     -exportOptionsPlist ExportOptionsAdHoc.plist \
                     -exportPath $PWD/build/ipa

      - name: Rename IPA
        run: |
          mv iosApp/build/ipa/*.ipa iosApp/build/ipa/Mosaic-Dev.ipa

      - name: Upload iOS Dev IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mosaic-Dev-IPA
          path: iosApp/build/ipa/Mosaic-Dev.ipa
          retention-days: 7